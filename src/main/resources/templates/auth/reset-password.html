<!DOCTYPE html>
<html lang="en" layout:decorate="~{layouts/auth}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div layout:fragment="content">

    <div class="card shadow-sm" th:fragment="reset-password-form" id="reset-password-form">
        <div class="card-body p-4">
            <h4 class="card-title mb-1">Reset Password</h4>
            <p class="text-muted mb-4">Choose a new password for your account.</p>
            <div class="alert alert-info" th:if="${message}" th:utext="${message}"></div>
            <form hx:post="@{/process-reset-password}" th:object="${resetPasswordForm}" hx-target="#reset-password-form" hx-swap="outerHTML">
                <input type="hidden" th:name="passwordResetToken" th:value="${passwordResetToken}">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" th:field="*{newPassword}" placeholder="Enter new password">
                    <span class="text-sm" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" th:field="*{newPasswordConfirmation}" class="form-control" placeholder="Re-enter new password">
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Reset Password</button>
                <div class="text-center">
                    <a th:href="@{/login}" class="small">Back to Log In</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
