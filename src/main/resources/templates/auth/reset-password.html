<!DOCTYPE html>
<html lang="en" layout:decorate="~{layouts/auth}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Dokezo</title>
</head>
<body>

<div layout:fragment="content" class="dk-auth__container">
    <div class="dk-auth-card" th:fragment="reset-password-form" id="reset-password-form">
        <p class="dk-auth-card__eyebrow">Security</p>
        <h1 class="dk-auth-card__title">Reset Password</h1>
        <p class="dk-auth-card__subtitle">Choose a new password for your account.</p>

        <div class="dk-alert dk-alert--info" th:if="${message}" th:utext="${message}"></div>

        <form hx-post="/process-reset-password"
              th:object="${resetPasswordForm}"
              hx-target="#reset-password-form"
              hx-swap="outerHTML">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:name="passwordResetToken" th:value="${passwordResetToken}">

            <div class="dk-field" th:classappend="${#fields.hasErrors('newPassword')} ? 'dk-field--error'">
                <label class="dk-field__label" for="newPassword">New Password</label>
                <input id="newPassword"
                       type="password"
                       class="dk-field__input"
                       th:field="*{newPassword}"
                       placeholder="Enter new password"
                       autocomplete="new-password">
                <span class="dk-field__error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
            </div>

            <div class="dk-field" th:classappend="${#fields.hasErrors('newPasswordConfirmation')} ? 'dk-field--error'">
                <label class="dk-field__label" for="newPasswordConfirmation">Confirm New Password</label>
                <input id="newPasswordConfirmation"
                       type="password"
                       th:field="*{newPasswordConfirmation}"
                       class="dk-field__input"
                       placeholder="Re-enter new password"
                       autocomplete="new-password">
                <span class="dk-field__error" th:if="${#fields.hasErrors('newPasswordConfirmation')}" th:errors="*{newPasswordConfirmation}"></span>
            </div>

            <button type="submit" class="dk-btn dk-btn--primary dk-btn--block">Reset Password</button>

            <div class="dk-auth__links dk-auth__links--center">
                <a th:href="@{/login}" class="dk-auth__link">&larr; Back to Log In</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
