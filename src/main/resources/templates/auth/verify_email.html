<!doctype html>
<html lang="en" layout:decorate="~{layouts/auth}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
</head>
<body>
<main class="container py-5" id="verify-email-wrapper" layout:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm text-center">
                <div class="card-body p-5">
                    <h1 class="h3 mb-3">Confirm your email address</h1>
                    <p class="text-muted mb-4">Click the button below to verify your email and activate your Dokezo account.</p>
                    <form hx-post="/process-verify-email" hx-target="#verify-email-wrapper" hx-swap="outerHTML">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" th:name="token" th:value="${token}"/>
                        <button type="submit" class="btn btn-primary btn-lg">Verify Email</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
