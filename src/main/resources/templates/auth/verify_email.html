<!doctype html>
<html lang="en" layout:decorate="~{layouts/auth}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify Email — Dokezo</title>
</head>
<body>

<div class="dk-auth__container" id="verify-email-wrapper" layout:fragment="content">
    <div class="dk-auth-card dk-auth-card--center">
        <div class="dk-auth-card__icon">✉</div>
        <p class="dk-auth-card__eyebrow">Email Verification</p>
        <h1 class="dk-auth-card__title">Confirm your email address</h1>
        <p class="dk-auth-card__subtitle">Click the button below to verify your email and activate your Dokezo account.</p>

        <form hx-post="/process-verify-email"
              hx-target="#verify-email-wrapper"
              hx-select="#verify-email-wrapper"
              hx-swap="outerHTML">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:name="token" th:value="${token}"/>
            <button type="submit" class="dk-btn dk-btn--primary dk-btn--block">Verify Email</button>
        </form>
    </div>
</div>

</body>
</html>
