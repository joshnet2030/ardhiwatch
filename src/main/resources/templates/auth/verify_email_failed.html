<!doctype html>
<html lang="en" layout:decorate="~{layouts/auth}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
</head>
<body>
<main class="container py-5" id="verify-email-failed-wrapper" layout:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm text-center">
                <div class="card-body p-5">
                    <div class="alert alert-info" th:if="${message}" th:text="${message}"></div>
                    <h1 class="h3 mb-3">This link isn&rsquo;t valid</h1>
                    <p class="text-muted mb-4">The verification link may have expired, been used already, or been copied
                        incorrectly. You can request a new one.</p>
                    <div class="d-flex justify-content-center">
                        <div th:replace="~{auth/resend_email_verification_token_form::form}"></div>
                        <a th:href="@{/login}" class="btn btn-primary">Log In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
