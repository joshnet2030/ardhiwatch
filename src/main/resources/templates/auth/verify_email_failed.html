<!doctype html>
<html lang="en" layout:decorate="~{layouts/auth}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verification Link Invalid — Dokezo</title>
</head>
<body>

<div class="dk-auth__container" id="verify-email-wrapper" layout:fragment="content">
    <div class="dk-auth-card dk-auth-card--center" id="verify-email-failed-wrapper">
        <div class="dk-auth-card__icon dk-auth-card__icon--warn">!</div>
        <p class="dk-auth-card__eyebrow">Verification Issue</p>
        <h1 class="dk-auth-card__title">This link isn&rsquo;t valid</h1>
        <p class="dk-auth-card__subtitle">The verification link may have expired, been used already, or been copied incorrectly. You can request a new one below.</p>

        <div class="dk-alert dk-alert--info" th:if="${message}" th:text="${message}"></div>

        <div class="dk-auth__actions-stack">
            <div th:replace="~{auth/resend_email_verification_token_form::form}"></div>
            <div class="dk-auth__links dk-auth__links--center" style="margin-top:.25rem;">
                <a th:href="@{/login}" class="dk-auth__link">&larr; Back to Log In</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
