<!doctype html>
<html lang="en" layout:decorate="~{layouts/auth}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email Verified — Dokezo</title>
</head>
<body>

<div class="dk-auth__container" id="verify-email-wrapper" layout:fragment="content">
    <div class="dk-auth-card dk-auth-card--center">
        <div class="dk-auth-card__icon">✓</div>
        <p class="dk-auth-card__eyebrow">Account Active</p>
        <h1 class="dk-auth-card__title">Email verified</h1>
        <p class="dk-auth-card__subtitle">Thank you. Your account is now active, so you can log in and add the keywords you want us to watch.</p>
        <a href="/login" class="dk-btn dk-btn--primary dk-btn--block">Log In</a>
    </div>
</div>

</body>
</html>
