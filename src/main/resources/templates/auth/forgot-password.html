<!DOCTYPE html>
<html lang="en" layout:decorate="~{layouts/auth}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid d-flex align-items-center justify-content-center">
    <div class="card shadow-sm">
        <div class="card-body p-4" th:fragment="forgot-password-form" id="forgot-password-form">
            <div class="alert alert-info" th:if="${message}" th:text="${message}"></div>
            <h4 class="card-title mb-1">Forgot Password</h4>
            <p class="text-muted mb-4">Enter the email address on your account and we'll send you a link to reset your password.</p>

            <form  hx:post="@{/process-forgot-password}" th:object="${forgotPasswordForm}" hx-target="#forgot-password-form" hx-swap="outerHTML">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="text" th:field="*{email}" class="form-control" placeholder="you@example.com">
                    <span class="text-sm" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Send Reset Link</button>
                <div class="text-center">
                    <a th:href="@{/login}" class="small">Back to Log In</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
