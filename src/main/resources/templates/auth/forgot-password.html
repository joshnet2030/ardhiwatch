<!DOCTYPE html>
<html lang="en" layout:decorate="~{layouts/auth}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Dokezo</title>
</head>
<body>

<div layout:fragment="content" class="dk-auth__container">
    <div class="dk-auth-card" th:fragment="forgot-password-form" id="forgot-password-form">
        <p class="dk-auth-card__eyebrow">Account Recovery</p>
        <h1 class="dk-auth-card__title">Forgot Password</h1>
        <p class="dk-auth-card__subtitle">Enter the email address on your account and we'll send you a link to reset your password.</p>

        <div class="dk-alert dk-alert--info" th:if="${message}" th:text="${message}"></div>

        <form hx:post="@{/process-forgot-password}"
              th:object="${forgotPasswordForm}"
              hx-target="#forgot-password-form"
              hx-swap="outerHTML">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="dk-field" th:classappend="${#fields.hasErrors('email')} ? 'dk-field--error'">
                <label class="dk-field__label" for="email">Email address</label>
                <input id="email"
                       type="text"
                       th:field="*{email}"
                       class="dk-field__input"
                       placeholder="you@example.com"
                       autocomplete="email">
                <span class="dk-field__error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <button type="submit" class="dk-btn dk-btn--primary dk-btn--block">Send Reset Link</button>

            <div class="dk-auth__links dk-auth__links--center">
                <a th:href="@{/login}" class="dk-auth__link">&larr; Back to Log In</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
