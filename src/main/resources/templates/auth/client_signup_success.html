<!DOCTYPE html>
<html lang="en" layout:decorate="~{layouts/auth}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Created — Dokezo</title>
</head>
<body>

<div layout:fragment="content" class="dk-auth__container dk-auth__container--wide">
    <div th:fragment="client_signup_success">
        <div class="dk-auth-card dk-auth-card--center">
            <div class="dk-auth-card__icon">✓</div>
            <p class="dk-auth-card__eyebrow">Almost there</p>
            <h1 class="dk-auth-card__title">Create Your Account</h1>
            <p class="dk-auth-card__subtitle" style="margin-bottom:0;">
                You have signed up successfully. Please click the link sent to your email to complete the process.
            </p>
        </div>
        <p class="dk-auth__subfooter">
            Already have an account? <a th:href="@{/login}">Log in</a>
        </p>
    </div>
</div>

</body>
</html>
