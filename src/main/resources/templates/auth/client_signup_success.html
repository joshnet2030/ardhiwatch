<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ardhi — Create Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">Ardhi</span>
  </nav>

  <div class="container-fluid d-flex align-items-center justify-content-center min-vh-100">
    <div class="row justify-content-center w-100" th:fragment="client_signup_success">
      <div class="col-md-7 col-lg-6 py-4">

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h4 class="card-title mb-1">Create Your Account</h4>
            <p class="text-muted mb-4">You have signed up successfuly. Please click the link sent to your email to complete the process.</p>
          </div>
        </div>
        <p class="text-center text-muted mt-3">
          Already have an account? <a th:href="@{/login}">Log in</a>
        </p>

      </div>
    </div>
  </div>

</body>
</html>
