<!doctype html>
<html lang="en" layout:decorate="~{layouts/auth}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In — Dokezo</title>
</head>
<body>

<div class="dk-auth__container" layout:fragment="content">
    <div class="dk-auth-card">
        <p class="dk-auth-card__eyebrow">Welcome back</p>
        <h1 class="dk-auth-card__title">Log In</h1>
        <p class="dk-auth-card__subtitle">Sign in to your Dokezo account to manage your watched keywords and alerts.</p>

        <div class="dk-alert dk-alert--error" th:if="${message}" th:text="${message}"></div>
        <div class="dk-alert dk-alert--info" th:if="${param.logout}">You have been logged out.</div>

        <form method="post" action="/process-login">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>

            <div class="dk-field">
                <label class="dk-field__label" for="username">Email address</label>
                <input id="username"
                       type="text"
                       class="dk-field__input"
                       name="username"
                       placeholder="you@example.com"
                       autocomplete="email">
            </div>

            <div class="dk-field">
                <label class="dk-field__label" for="password">Password</label>
                <input id="password"
                       type="password"
                       class="dk-field__input"
                       name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password">
            </div>

            <button type="submit" class="dk-btn dk-btn--primary dk-btn--block">Log In</button>

            <div class="dk-auth__links">
                <a th:href="@{/forgot-password}" class="dk-auth__link">Forgot your password?</a>
                <a th:href="@{/client-signup}" class="dk-auth__link dk-auth__link--accent">Create account</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
