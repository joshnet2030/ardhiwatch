<!doctype html>
<html lang="en" layout:decorate="~{layouts/auth.html}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
</head>
<body>

<div class="col-md-5 col-lg-4" layout:fragment="content">
    <div class="card shadow-sm" >
        <div class="card-body p-4">
            <h4 class="card-title mb-1">Log In</h4>
            <p class="text-muted mb-4">Sign in to your Ardhi account.</p>

            <form method="post" action="/process-login">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="text" class="form-control" name="username" placeholder="you@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Log In</button>
                <div class="text-center">
                    <div class="d-flex gap-2 justify-content-center">
                        <a th:href="@{/forgot-password}" class="small">Forgot your password?</a>
                        <a th:href="@{/client-signup}" class="small">Create account</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
