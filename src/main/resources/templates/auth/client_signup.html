<!DOCTYPE html>
<html lang="en" layout:decorate="~{layouts/auth}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Dokezo</title>
</head>
<body>

<div layout:fragment="content" class="dk-auth__container dk-auth__container--wide">
    <div id="client-signup-form-wrapper" th:fragment="client-signup-form">
        <div class="dk-auth-card">
            <p class="dk-auth-card__eyebrow">Get Started</p>
            <h1 class="dk-auth-card__title">Create Your Account</h1>
            <p class="dk-auth-card__subtitle">Watch the Kenya Gazette for your name, title number, or ID — and get notified the moment they appear.</p>

            <form hx-post="/process-client-signup"
                  hx-target="#client-signup-form-wrapper"
                  hx-swap="outerHTML"
                  th:object="${signUpForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="dk-field" th:classappend="${#fields.hasErrors('fullName')} ? 'dk-field--error'">
                    <label class="dk-field__label" for="fullName">Full Name</label>
                    <input id="fullName"
                           type="text"
                           class="dk-field__input"
                           th:field="*{fullName}"
                           placeholder="Jane Doe"
                           autocomplete="name">
                    <span class="dk-field__error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                </div>

                <div class="dk-field-row">
                    <div class="dk-field" th:classappend="${#fields.hasErrors('email')} ? 'dk-field--error'">
                        <label class="dk-field__label" for="email">Email Address</label>
                        <input id="email"
                               type="email"
                               class="dk-field__input"
                               th:field="*{email}"
                               placeholder="you@example.com"
                               autocomplete="email">
                        <span class="dk-field__error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <div class="dk-field" th:classappend="${#fields.hasErrors('phoneNumber')} ? 'dk-field--error'">
                        <label class="dk-field__label" for="phoneNumber">Phone Number</label>
                        <input id="phoneNumber"
                               type="tel"
                               class="dk-field__input"
                               th:field="*{phoneNumber}"
                               placeholder="+254 7xx xxx xxx"
                               autocomplete="tel">
                        <span class="dk-field__error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></span>
                    </div>
                </div>

                <div class="dk-field-row">
                    <div class="dk-field" th:classappend="${#fields.hasErrors('password')} ? 'dk-field--error'">
                        <label class="dk-field__label" for="password">Password</label>
                        <input id="password"
                               type="password"
                               class="dk-field__input"
                               th:field="*{password}"
                               placeholder="Create a password"
                               autocomplete="new-password">
                        <span class="dk-field__error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>

                    <div class="dk-field" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'dk-field--error'">
                        <label class="dk-field__label" for="confirmPassword">Confirm Password</label>
                        <input id="confirmPassword"
                               type="password"
                               class="dk-field__input"
                               placeholder="Re-enter your password"
                               th:field="*{confirmPassword}"
                               autocomplete="new-password">
                        <span class="dk-field__error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                    </div>
                </div>

                <div class="dk-field">
                    <div class="dk-check">
                        <input type="checkbox"
                               class="dk-check__input"
                               id="agreeTerms"
                               th:field="*{agreeTerms}"
                               value="true">
                        <label class="dk-check__label" for="agreeTerms">
                            I agree to the <a href="/terms">Terms of Service</a> and <a href="/privacy-policy">Privacy Policy</a>.
                        </label>
                    </div>
                    <span class="dk-field__error" th:if="${#fields.hasErrors('agreeTerms')}" th:errors="*{agreeTerms}"></span>
                </div>

                <button type="submit" class="dk-btn dk-btn--primary dk-btn--block">Create Account</button>
                <p class="dk-auth__hint">You'll choose a plan and add the keywords you want watched right after signing up.</p>
            </form>
        </div>

        <p class="dk-auth__subfooter">
            Already have an account? <a th:href="@{/login}">Log in</a>
        </p>
    </div>
</div>

</body>
</html>
