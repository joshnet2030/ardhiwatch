<!DOCTYPE html>
<html lang="en" layout:decorate="~{layouts/auth}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ardhi — Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">Ardhi</span>
</nav>

<div layout:fragment="content" class="container-fluid d-flex align-items-center justify-content-center">
    <div class="row justify-content-center" id="client-signup-form-wrapper" th:fragment="client-signup-form">
        <div class="col-md-7 col-lg-6 py-4">

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title mb-1">Create Your Account</h4>
                    <p class="text-muted mb-4">Watch the Kenya Gazette for your name, title number, or ID — and get
                        notified the moment they appear.</p>

                    <form hx:post="@{/process-client-signup}" hx-target="#client-signup-form-wrapper"
                          hx-swap="outerHTML" th:object="${signUpForm}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" th:field="*{fullName}">
                                <span class="text-sm text-danger" th:errors="*{fullName}"></span>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" th:field="*{email}">
                                <span class="text-sm text-danger" th:errors="*{email}"></span>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" th:field="*{phoneNumber}">
                                <span class="text-sm text-danger" th:errors="*{phoneNumber}"></span>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" th:field="*{password}">
                                <span class="text-sm text-danger" th:errors="*{password}"></span>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Re-enter your password"
                                       th:field="*{confirmPassword}">
                            </div>
                        </div>

                        <div class="form-check my-3">
                            <input type="checkbox" class="form-check-input" id="agreeTerms" th:field="*{agreeTerms}" value="true">
                            <label class="form-check-label small" for="agreeTerms">
                                I agree to the <a href="">Terms of Service</a> and <a>Privacy Policy</a>.
                            </label>
                            <div class="text-sm text-danger" th:errors="*{agreeTerms}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-2">Create Account</button>
                        <p class="text-muted small mb-0">You'll choose a plan and add the keywords you want watched
                            right after signing up.</p>
                    </form>
                </div>
            </div>

            <p class="text-center text-muted mt-3">
                Already have an account? <a th:href="@{/login}">Log in</a>
            </p>

        </div>
    </div>
</div>

</body>
</html>
