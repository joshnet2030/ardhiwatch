<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Dokezo watches every Kenya Gazette issue and alerts you instantly when your name, title number, or ID is mentioned — protecting your land from fraud."/>
    <title>Dokezo — Know when your land is mentioned in the Kenya Gazette</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script th:src="@{/js/htmx.min.js}" defer></script>
</head>
<body>

<!-- Navbar -->
<nav class="dk-nav">
    <a th:href="${dashboardUrl != null ? dashboardUrl : '/'}" class="dk-nav__brand">Doke<span>zo</span></a>
    <div class="dk-nav__links">
        <th:block th:if="${dashboardUrl == null}">
            <a href="/#how-it-works" class="dk-link">How it works</a>
            <a href="/#pricing" class="dk-link">Pricing</a>
            <a href="/#faq" class="dk-link">FAQ</a>
            <a href="/login" class="dk-btn dk-btn--outline" style="margin-left:.5rem;">Log In</a>
            <a href="/client-signup" class="dk-btn dk-btn--primary">Sign Up</a>
        </th:block>
        <th:block th:if="${dashboardUrl != null}">
            <a th:href="${dashboardUrl}" class="dk-btn dk-btn--primary" style="margin-left:.5rem;">Go to Dashboard &rarr;</a>
        </th:block>
    </div>
</nav>

<!-- Page content injected here -->
<th:block layout:fragment="content"></th:block>

<!-- Footer -->
<footer class="dk-footer">
    <p style="margin:0 0 .5rem;">&copy; 2025 Dokezo. All rights reserved.</p>
    <a href="/terms">Terms of Service</a>
    <a href="/privacy-policy">Privacy Policy</a>
    <a href="/contact-us">Contact</a>
</footer>

<!-- FAQ accordion script -->
<script>
    document.querySelectorAll('.dk-faq__q').forEach(btn => {
        btn.addEventListener('click', () => {
            const item = btn.closest('.dk-faq');
            const isOpen = item.classList.contains('open');
            document.querySelectorAll('.dk-faq').forEach(f => f.classList.remove('open'));
            if (!isOpen) item.classList.add('open');
        });
    });

    // Scroll-triggered fade-up animations
    const observer = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
</script>

</body>
</html>
