<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ardhi Admin — Dashboard</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <script th:src="@{/js/htmx.min.js}" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
</head>
<body class="bg-light">

<!-- Top navbar -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">Ardhi Admin</span>
    <span class="navbar-text text-white me-3">Signed in as Jane Admin</span>
    <block th:replace="~{layouts/partials/logout-link}"></block>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <nav class="col-md-2 bg-white border-end vh-100 p-0">
            <div class="list-group list-group-flush">
                <a th:classappend="${currentMenu == 'dashboard'} ? 'active'" th:href="@{/admin}" class="list-group-item list-group-item-action">Dashboard</span></a>
                <a th:classappend="${currentMenu == 'gazettes'} ? 'active'" th:href="@{/admin/gazettes}" class="list-group-item list-group-item-action">Gazette Issues</a>
                <a th:classappend="${currentMenu == 'matches'} ? 'active'" th:href="@{/admin/matches}" class="list-group-item list-group-item-action">Keyword Matches</a>
                <a th:classappend="${currentMenu == 'clients'} ? 'active'" th:href="@{/admin/clients}" class="list-group-item list-group-item-action">Clients</a>
                <a th:classappend="${currentMenu == 'subscriptions'} ? 'active'" th:href="@{/admin/subscriptions}" class="list-group-item list-group-item-action">Subscription Plans</a>
                <a th:classappend="${currentMenu == 'payments'} ? 'active'"th:href="@{/admin/payments}" class="list-group-item list-group-item-action">Payments</a>
                <a th:classappend="${currentMenu == 'admin-users'} ? 'active'"th:href="@{/admin/admin-users}" class="list-group-item list-group-item-action">Admin Users</a>
                <a th:classappend="${currentMenu == 'settings'} ? 'active'" th:href="@{/admin/settings}" class="list-group-item list-group-item-action">Settings</a>
            </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-10 p-4" layout:fragment="content">
            <footer class="text-muted text-center small pb-4">
                Ardhi Admin
            </footer>
        </main>
    </div>
</div>

</body>
</html>
