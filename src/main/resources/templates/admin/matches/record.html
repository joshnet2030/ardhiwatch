<!doctype html>
<html lang="en" layout:decorate="~{layouts/admin.html}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Match</title>
</head>
<body>
<div layout:fragment="content">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin/matches}">Matches Review</a></li>
            <li class="breadcrumb-item active" aria-current="page"
                th:text="${match != null ? 'Match ' + match.shortCode : 'Match'}">Match #1043</li>
        </ol>
    </nav>

    <div th:if="${reviewSuccess}" class="alert alert-success py-2 mb-3" role="alert" th:text="${reviewSuccess}"></div>
    <div th:if="${reviewError}" class="alert alert-danger py-2 mb-3" role="alert" th:text="${reviewError}"></div>
    <div th:if="${matchError}" class="alert alert-danger py-2 mb-3" role="alert" th:text="${matchError}"></div>

    <!-- Record header -->
    <div class="d-flex flex-wrap justify-content-between align-items-start mb-3 gap-2" th:if="${match != null}">
        <div>
            <h2 class="mb-1" th:text="'Match ' + ${match.shortCode}">Match #1043</h2>
            <p class="text-muted mb-0">
                <a th:href="@{/admin/clients/show/{cid}(cid=${match.client.id})}"
                   th:text="${match.client.fullName}">Samuel Otieno</a>
                &middot;
                <span th:text="${match.keywordText}">Samuel Otieno Odhiambo</span>
                &middot;
                <a th:href="@{/admin/gazettes/show/{iid}/pages(iid=${match.gazetteIssue.id}, page=${match.gazettePage.pageNumber})}"
                   th:text="'Vol. ' + ${match.gazetteIssue.volumeNumber} + ', No. ' + ${match.gazetteIssue.issueNumber} + ', page ' + ${match.gazettePage.pageNumber}">
                    Vol. 128, No. 37, page 61
                </a>
                <span th:if="${match.status.name() == 'PENDING_REVIEW'}" class="badge bg-warning text-dark ms-2">Pending Review</span>
                <span th:if="${match.status.name() == 'APPROVED'}" class="badge bg-success ms-2">Approved</span>
                <span th:if="${match.status.name() == 'REJECTED'}" class="badge bg-danger ms-2">Rejected</span>
            </p>
        </div>
        <div class="btn-group btn-group-sm">
            <a th:href="${prevMatch != null} ? @{/admin/matches/show/{mid}(mid=${prevMatch.id})} : '#'"
               class="btn btn-outline-secondary"
               th:classappend="${prevMatch == null} ? 'disabled'">&laquo; Previous in Queue</a>
            <a th:href="${nextMatch != null} ? @{/admin/matches/show/{mid}(mid=${nextMatch.id})} : '#'"
               class="btn btn-outline-secondary"
               th:classappend="${nextMatch == null} ? 'disabled'">Next in Queue &raquo;</a>
        </div>
    </div>

    <!-- Tab navigation -->
    <ul class="nav nav-tabs mb-4" th:if="${match != null}">
        <li class="nav-item">
            <a th:classappend="${currentTab == 'overview'} ? 'active'"
               class="nav-link"
               th:href="@{/admin/matches/show/{mid}(mid=${match.id})}">Overview</a>
        </li>
        <li class="nav-item">
            <a th:classappend="${currentTab == 'notifications'} ? 'active'"
               class="nav-link"
               th:href="@{/admin/matches/show/{mid}/notifications(mid=${match.id})}">
                Notifications <span class="badge bg-secondary ms-1" th:text="${notificationsCount != null ? notificationsCount : 0}">0</span>
            </a>
        </li>
    </ul>

    <!-- Tab content goes here -->
    <div layout:fragment="tab"></div>

</div>
</body>
</html>
