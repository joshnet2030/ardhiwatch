<!doctype html>
<html lang="en" layout:decorate="~{layouts/admin}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gazette Issues</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Gazette Issues</h2>
    </div>

    <!-- Upload new issue (reusable HTMX fragment) -->
    <div th:replace="~{admin/gazettes/fragments/upload-form :: uploadForm}"></div>

    <!-- Filters -->
    <div class="card mb-4">
        <div class="card-body">
            <form action="#" method="get" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" name="status" class="form-select">
                        <option value="" selected>All Statuses</option>
                        <option value="UPLOADED">Uploaded</option>
                        <option value="SPLITTING">Splitting</option>
                        <option value="OCR_PROCESSING">OCR Processing</option>
                        <option value="OCR_DONE">OCR Done</option>
                        <option value="MATCHING">Matching</option>
                        <option value="MATCHED">Matched</option>
                        <option value="REVIEWED">Reviewed</option>
                        <option value="NOTIFIED">Notified</option>
                        <option value="FAILED">Failed</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="from" class="form-label">From Date</label>
                    <input type="date" id="from" name="from" class="form-control">
                </div>
                <div class="col-md-3">
                    <label for="to" class="form-label">To Date</label>
                    <input type="date" id="to" name="to" class="form-control">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-outline-secondary w-100">Filter</button>
                    <a th:href="@{/admin/gazettes}" class="btn btn-link">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Issues table -->
    <div class="card mb-4"
         id="gazettes-list-table"
         hx-get="/admin/gazettes/table?view=list"
         hx-trigger="gazetteUploaded from:body"
         hx-swap="innerHTML">
        <div th:replace="~{admin/gazettes/fragments/issues-table :: listTable}"></div>
    </div>

</div>
</body>
</html>
