<td th:fragment="gazetteStatus(status)" th:switch="${status != null ? status.toString().toUpperCase() : ''}">
    <span th:case="'NOTIFIED'" class="badge bg-success">Notified</span>
    <span th:case="'REVIEWED'" class="badge bg-info text-dark">Reviewed</span>
    <span th:case="'MATCHED'" class="badge bg-primary">Matched</span>
    <span th:case="'MATCHING'" class="badge bg-warning text-dark">Matching</span>
    <span th:case="'OCR_DONE'" class="badge bg-primary">OCR Done</span>
    <span th:case="'OCR_PROCESSING'" class="badge bg-secondary">OCR Processing</span>
    <span th:case="'SPLITTING'" class="badge bg-secondary">Splitting</span>
    <span th:case="'UPLOADED'" class="badge bg-light text-dark border">Uploaded</span>
    <span th:case="'FAILED'" class="badge bg-danger">Failed</span>
    <span th:case="*" class="badge bg-light text-dark border" th:text="${status}"></span>
</td>
