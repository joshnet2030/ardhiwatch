<!doctype html>
<html lang="en" layout:decorate="~{layouts/admin.html}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Client</title>
</head>
<body>
<div layout:fragment="content">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin/clients}">Clients</a></li>
            <li class="breadcrumb-item active" aria-current="page"
                th:text="${client != null ? client.fullName : 'Peter Mwangi'}">Peter Mwangi</li>
        </ol>
    </nav>

    <!-- Record header -->
    <div class="d-flex flex-wrap justify-content-between align-items-start mb-3 gap-2">
        <div>
            <h2 class="mb-1" th:text="${client != null ? client.fullName : 'Peter Mwangi'}">Peter Mwangi</h2>
            <p class="text-muted mb-0">
                <span th:text="${client != null ? client.email : 'peter@example.com'}">peter@example.com</span>
                <span th:if="${client == null or client.emailVerified}" class="badge bg-success ms-1">Verified</span>
                <span th:if="${client != null and !client.emailVerified}" class="badge bg-warning text-dark ms-1">Unverified</span>
                &middot;
                <span th:text="${client != null and client.phone != null ? client.phone : '+254 712 345 678'}">+254 712 345 678</span>
                <span th:if="${client == null or client.active}" class="badge bg-success ms-2">Active</span>
                <span th:if="${client != null and !client.active}" class="badge bg-danger ms-2">Suspended</span>
                <span th:if="${client != null}"
                      class="badge bg-info text-dark ms-2"
                      th:text="'Wallet: KES ' + ${#numbers.formatDecimal(client.walletBalance, 1, 'COMMA', 2, 'POINT')}">
                    Wallet: KES 0.00
                </span>
            </p>
        </div>
        <div class="d-flex flex-wrap gap-2" th:if="${client != null}">
            <button type="button"
                    class="btn btn-outline-secondary"
                    th:attr="hx-get=@{/admin/clients/modal/edit/{id}(id=${client.id})}"
                    hx-target="#clientModalDialog"
                    hx-swap="innerHTML"
                    data-bs-toggle="modal"
                    data-bs-target="#clientModal">
                Edit
            </button>
            <button type="button"
                    th:if="${client.active}"
                    class="btn btn-outline-danger"
                    th:attr="hx-get=@{/admin/clients/modal/status/{id}(id=${client.id})}"
                    hx-target="#clientModalDialog"
                    hx-swap="innerHTML"
                    data-bs-toggle="modal"
                    data-bs-target="#clientModal">
                Suspend
            </button>
            <button type="button"
                    th:unless="${client.active}"
                    class="btn btn-outline-success"
                    th:attr="hx-get=@{/admin/clients/modal/status/{id}(id=${client.id})}"
                    hx-target="#clientModalDialog"
                    hx-swap="innerHTML"
                    data-bs-toggle="modal"
                    data-bs-target="#clientModal">
                Reinstate
            </button>
        </div>
    </div>

    <!-- Tab navigation -->
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <a th:classappend="${currentTab == 'overview'} ? 'active'"
               class="nav-link"
               th:href="${client != null} ? @{/admin/clients/show/{id}(id=${client.id})} : '#'">Overview</a>
        </li>
        <li class="nav-item">
            <a th:classappend="${currentTab == 'keywords'} ? 'active'"
               class="nav-link"
               th:href="${client != null} ? @{/admin/clients/show/{id}/keywords(id=${client.id})} : '#'">
                Keywords <span class="badge bg-secondary ms-1" th:text="${keywordsCount != null ? keywordsCount : 0}">0</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:classappend="${currentTab == 'matches'} ? 'active'"
               class="nav-link"
               th:href="${client != null} ? @{/admin/clients/show/{id}/matches(id=${client.id})} : '#'">
                Matches <span class="badge bg-secondary ms-1" th:text="${matchesCount != null ? matchesCount : 0}">0</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:classappend="${currentTab == 'notifications'} ? 'active'"
               class="nav-link"
               th:href="${client != null} ? @{/admin/clients/show/{id}/notifications(id=${client.id})} : '#'">
                Notifications <span class="badge bg-secondary ms-1" th:text="${notificationsCount != null ? notificationsCount : 0}">0</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:classappend="${currentTab == 'subscriptions'} ? 'active'"
               class="nav-link"
               th:href="${client != null} ? @{/admin/clients/show/{id}/subscriptions(id=${client.id})} : '#'">
                Subscriptions <span class="badge bg-secondary ms-1" th:text="${subscriptionsCount != null ? subscriptionsCount : 0}">0</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:classappend="${currentTab == 'transactions'} ? 'active'"
               class="nav-link"
               th:href="${client != null} ? @{/admin/clients/show/{id}/transactions(id=${client.id})} : '#'">
                Transactions <span class="badge bg-secondary ms-1" th:text="${transactionsCount != null ? transactionsCount : 0}">0</span>
            </a>
        </li>
    </ul>

    <!-- Tab content goes here -->
    <div layout:fragment="tab"></div>

    <!-- Bootstrap 5 Modal Shell populated dynamically via HTMX -->
    <div class="modal fade" id="clientModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" id="clientModalDialog">
            <div class="modal-content">
                <div class="modal-body text-center py-4 text-muted">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        function hideClientModal() {
            var modalEl = document.getElementById('clientModal');
            if (modalEl && window.bootstrap) {
                var modalInstance = bootstrap.Modal.getInstance(modalEl);
                if (modalInstance) {
                    modalInstance.hide();
                }
            }
        }
        document.body.addEventListener('clientSaved', function () {
            hideClientModal();
            window.location.reload();
        });
        document.body.addEventListener('keywordSaved', hideClientModal);
        document.body.addEventListener('subscriptionSaved', hideClientModal);
        document.body.addEventListener('subscriptionCancelled', hideClientModal);
        document.body.addEventListener('paymentSaved', hideClientModal);
    </script>

</div>
</body>
</html>
