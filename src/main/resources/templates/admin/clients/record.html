<!doctype html>
<html lang="en" layout:decorate="~{layouts/admin.html}">
<head>
    <meta charset="UTF-8">

<div layout:fragment="content">

    <nav aria-label="breadcrumb">

    <div class="d-flex flex-wrap justify-content-between align-items-start mb-3 gap-2">
        <div>
            <h2 class="mb-1">Peter Mwangi</h2>
            <p class="text-muted mb-0">
                peter@example.com <span class="badge bg-success">Verified</span> &middot; +254 712 345 678

            <a href="#" class="btn btn-outline-secondary">Edit</a>

    <!-- Tab navigation -->
    <ul class="nav nav-tabs mb-4">

        <li class="nav-item"><a th:classappend="${currentTab == 'transactions'}? 'active'" class="nav-link" th:href="@{/admin/clients/show/123/transactions}">Transactions <span class="badge bg-secondary ms-1">4</span></a></li>
    </ul>

    <!-- Tab content goes here -->
    <div layout:fragment="tab"></div>
