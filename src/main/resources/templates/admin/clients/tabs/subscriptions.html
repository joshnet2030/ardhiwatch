<!doctype html>
<html lang="en" layout:decorate="~{admin/clients/record.html}">
<head>
    <meta charset="UTF-8">
    <title>Client &ndash; Subscriptions</title>
</head>
<body>
<div layout:fragment="tab">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Subscriptions</h5>
        <a href="#" class="btn btn-primary btn-sm">Add Subscription</a>
    </div>

    <div class="card mb-4">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0 align-middle">
                <thead>
                <tr>
                    <th>Plan</th>
                    <th>Status</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Days Left</th>
                    <th class="text-end">Paid (KES)</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>Landlord Pro</td>
                    <td><span class="badge bg-success">Active</span></td>
                    <td>2025-12-15</td>
                    <td>2026-12-15</td>
                    <td>40</td>
                    <td class="text-end">4,500.00</td>
                    <td class="text-nowrap">
                        <a href="#" class="btn btn-sm btn-outline-primary">Extend</a>
                        <a href="#" class="btn btn-sm btn-outline-secondary">Change Plan</a>
                        <a href="#" class="btn btn-sm btn-outline-danger">Cancel</a>
                    </td>
                </tr>
                <tr class="table-secondary">
                    <td>Basic</td>
                    <td><span class="badge bg-secondary">Expired</span></td>
                    <td>2024-12-15</td>
                    <td>2025-12-15</td>
                    <td>0</td>
                    <td class="text-end">1,500.00</td>
                    <td class="text-nowrap">
                        <a href="#" class="btn btn-sm btn-outline-secondary">View</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
