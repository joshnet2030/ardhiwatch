<!doctype html>
<html lang="en" layout:decorate="~{admin/clients/record.html}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Client &ndash; Transactions</title>
</head>
<body>
<div layout:fragment="tab">

    <div id="client-transactions-section"
         th:attr="hx-get=${client != null} ? @{/admin/clients/show/{id}/transactions/table(id=${client.id})} : null"
         hx-trigger="paymentSaved from:body, subscriptionSaved from:body"
         hx-swap="outerHTML"
         th:fragment="transactionsSection">

        <div th:if="${transactionsError}" class="alert alert-danger py-2 mb-3" role="alert" th:text="${transactionsError}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Transactions</h5>
            <button th:if="${client != null}"
                    type="button"
                    class="btn btn-primary btn-sm"
                    th:attr="hx-get=@{/admin/clients/show/{id}/transactions/modal/record(id=${client.id})}"
                    hx-target="#clientModalDialog"
                    hx-swap="innerHTML"
                    data-bs-toggle="modal"
                    data-bs-target="#clientModal">
                Record Payment
            </button>
        </div>

        <div class="card mb-4">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Plan</th>
                        <th class="text-end">Amount (KES)</th>
                        <th>Method</th>
                        <th>Receipt No.</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(transactions)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            No transactions recorded for this client yet. Click "Record Payment" above to add one.
                        </td>
                    </tr>
                    <tr th:each="tx : ${transactions}"
                        th:classappend="${tx.status.name() == 'FAILED'} ? 'table-danger' : (${tx.status.name() == 'PENDING'} ? 'table-warning' : (${tx.status.name() == 'REFUNDED'} ? 'table-secondary' : ''))">
                        <td th:text="${tx.createdAt != null ? #temporals.format(tx.createdAt, 'yyyy-MM-dd HH:mm') : '—'}">2025-12-15 09:40</td>
                        <td>
                            <span th:if="${tx.subscriptionPlan != null}" th:text="${tx.subscriptionPlan.name}">Landlord Pro</span>
                            <span th:if="${tx.subscriptionPlan == null and tx.clientSubscriptionPlan != null}"
                                  th:text="${tx.clientSubscriptionPlan.subscriptionPlan.name}">Landlord Pro</span>
                            <span th:if="${tx.subscriptionPlan == null and tx.clientSubscriptionPlan == null}" class="text-muted">&mdash;</span>
                        </td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(tx.amount, 1, 'COMMA', 2, 'POINT')}">4,500.00</td>
                        <td th:text="${tx.paymentMethod != null ? tx.paymentMethod.label : 'M-Pesa'}">M-Pesa</td>
                        <td>
                            <span th:if="${tx.receiptNumber != null and !#strings.isEmpty(tx.receiptNumber)}" th:text="${tx.receiptNumber}">SL15X2LM9P</span>
                            <span th:if="${tx.receiptNumber == null or #strings.isEmpty(tx.receiptNumber)}" class="text-muted">&mdash;</span>
                        </td>
                        <td>
                            <span th:if="${tx.status.name() == 'COMPLETED'}" class="badge bg-success">Completed</span>
                            <span th:if="${tx.status.name() == 'PENDING'}" class="badge bg-warning text-dark">Pending</span>
                            <span th:if="${tx.status.name() == 'FAILED'}" class="badge bg-danger">Failed</span>
                            <span th:if="${tx.status.name() == 'REFUNDED'}" class="badge bg-secondary">Refunded</span>
                        </td>
                        <td class="text-nowrap text-end">
                            <a th:href="@{/admin/transactions/show/{tid}(tid=${tx.id})}"
                               class="btn btn-sm btn-outline-primary">View</a>
                            <form th:if="${tx.status.name() == 'PENDING'}"
                                  th:action="@{/admin/clients/show/{id}/transactions/{tid}/reconcile(id=${client.id}, tid=${tx.id})}"
                                  method="post"
                                  th:attr="hx-post=@{/admin/clients/show/{id}/transactions/{tid}/reconcile(id=${client.id}, tid=${tx.id})}"
                                  hx-target="#client-transactions-section"
                                  hx-swap="outerHTML"
                                  class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-outline-secondary">Reconcile</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
