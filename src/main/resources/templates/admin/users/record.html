<!doctype html>
<html lang="en" layout:decorate="~{layouts/admin.html}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin User</title>
</head>
<body>
<div layout:fragment="content">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin/users}">Users</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${user != null ? user.fullName : 'John Deputy'}">John Deputy</li>
        </ol>
    </nav>

    <!-- Record header -->
    <div class="d-flex flex-wrap justify-content-between align-items-start mb-3 gap-2">
        <div>
            <h2 class="mb-1" th:text="${user != null ? user.fullName : 'John Deputy'}">John Deputy</h2>
            <p class="text-muted mb-0">
                <span th:text="${user != null ? user.email : 'john@dokezo.co.ke'}">john@dokezo.co.ke</span>
                <span th:if="${user == null or user.emailVerified}" class="badge bg-success">Verified</span>
                <span th:if="${user != null and !user.emailVerified}" class="badge bg-warning text-dark">Unverified</span>
                &middot;
                <span th:text="${user != null and user.phone != null ? user.phone : '+254 700 000 002'}">+254 700 000 002</span>
                <span class="badge bg-secondary ms-2" th:text="${user != null and user.role != null ? user.role.name() : 'Admin'}">Admin</span>
                <span th:if="${user == null or user.active}" class="badge bg-success">Active</span>
                <span th:if="${user != null and !user.active}" class="badge bg-danger">Suspended</span>
            </p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a href="#" class="btn btn-outline-secondary">Edit</a>
            <a href="#" class="btn btn-outline-danger">Suspend</a>
        </div>
    </div>

    <!-- Tab navigation -->
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <a class="nav-link"
               th:classappend="${currentTab == 'overview'} ? 'active'"
               th:href="${user != null} ? @{/admin/users/show/{id}(id=${user.id})} : '#'">Overview</a>
        </li>
        <li class="nav-item">
            <a class="nav-link"
               th:classappend="${currentTab == 'activities'} ? 'active'"
               th:href="${user != null} ? @{/admin/users/show/{id}/activities(id=${user.id})} : '#'">Activity</a>
        </li>
    </ul>

    <!-- Tab content goes here -->
    <div layout:fragment="tab"></div>

</div>
</body>
</html>
