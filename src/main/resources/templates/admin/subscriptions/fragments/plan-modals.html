<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Create / Edit Subscription Plan Modal Content Fragment -->
<div class="modal-content" th:fragment="planFormModal">
    <form th:action="${isEdit} ? @{/admin/subscriptions/process-edit/{id}(id=${planForm.id})} : @{/admin/subscriptions/process-create}"
          th:attr="hx-post=${isEdit} ? @{/admin/subscriptions/process-edit/{id}(id=${planForm.id})} : @{/admin/subscriptions/process-create}"
          hx-target="#planModalDialog"
          hx-swap="innerHTML"
          th:object="${planForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="modal-header">
            <h5 class="modal-title" th:text="${isEdit} ? 'Edit Subscription Plan' : 'Create Subscription Plan'">Create Subscription Plan</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
            <div th:if="${modalError}" class="alert alert-danger py-2 mb-3" role="alert" th:text="${modalError}"></div>

            <div class="row g-3">
                <div class="col-12">
                    <label for="name" class="form-label">Plan Name</label>
                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                           placeholder="e.g. Landlord Pro">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="col-md-6">
                    <label for="priceKes" class="form-label">Price (KES)</label>
                    <input type="number"
                           step="0.01"
                           min="0"
                           id="priceKes"
                           th:field="*{priceKes}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('priceKes')} ? 'is-invalid'"
                           placeholder="e.g. 4500.00">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('priceKes')}" th:errors="*{priceKes}"></div>
                </div>

                <div class="col-md-6">
                    <label for="billingPeriod" class="form-label">Billing Period</label>
                    <select id="billingPeriod"
                            th:field="*{billingPeriod}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('billingPeriod')} ? 'is-invalid'">
                        <option value="Annual">Annual</option>
                        <option value="Quarterly">Quarterly</option>
                        <option value="Monthly">Monthly</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('billingPeriod')}" th:errors="*{billingPeriod}"></div>
                </div>

                <div class="col-md-6">
                    <label for="keywordLimit" class="form-label">Keyword Limit</label>
                    <input type="number"
                           min="1"
                           id="keywordLimit"
                           th:field="*{keywordLimit}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('keywordLimit')} ? 'is-invalid'"
                           placeholder="e.g. 5">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('keywordLimit')}" th:errors="*{keywordLimit}"></div>
                </div>

                <div class="col-md-6 d-flex align-items-end" th:if="${!isEdit}">
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                        <label class="form-check-label" for="active">
                            Put on sale immediately
                        </label>
                    </div>
                </div>

                <div class="col-12">
                    <label for="description" class="form-label">Description (optional)</label>
                    <textarea id="description"
                              th:field="*{description}"
                              class="form-control"
                              rows="2"
                              placeholder="Brief summary of who this plan is for"></textarea>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Save Changes' : 'Create Plan'">Create Plan</button>
        </div>
    </form>
</div>

<!-- Activate / Deactivate (Retire) Subscription Plan Modal Content Fragment -->
<div class="modal-content" th:fragment="planStatusModal">
    <form th:if="${plan != null}"
          th:action="@{/admin/subscriptions/process-status/{id}(id=${plan.id})}"
          th:attr="hx-post=@{/admin/subscriptions/process-status/{id}(id=${plan.id})}"
          hx-target="#planModalDialog"
          hx-swap="innerHTML">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="active" th:value="${!plan.active}"/>

        <div class="modal-header">
            <h5 class="modal-title"
                th:text="${plan.active} ? 'Retire Plan: ' + ${plan.name} : 'Reactivate Plan: ' + ${plan.name}">
                Retire Plan
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
            <div th:if="${modalError}" class="alert alert-danger py-2 mb-3" role="alert" th:text="${modalError}"></div>

            <div th:if="${plan.active}">
                <p class="mb-3">
                    Are you sure you want to retire <strong th:text="${plan.name}">Plan</strong> from sale?
                    Existing subscribers keep their active subscription until renewal, but new clients will no longer be able to select this plan.
                </p>
                <div class="mb-0">
                    <label for="deactivationMemo" class="form-label">Reason / Note (optional)</label>
                    <textarea id="deactivationMemo"
                              name="deactivationMemo"
                              class="form-control"
                              rows="2"
                              placeholder="e.g. Replaced by updated 2026 pricing"></textarea>
                </div>
            </div>

            <div th:unless="${plan.active}">
                <p class="mb-0">
                    Put <strong th:text="${plan.name}">Plan</strong> (<span th:text="'KES ' + ${#numbers.formatDecimal(plan.priceKes, 1, 'COMMA', 2, 'POINT')} + ' / ' + ${plan.billingPeriod}">KES 1,500.00 / Annual</span>) back on sale for new and renewing clients?
                </p>
            </div>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit"
                    class="btn"
                    th:classappend="${plan.active} ? 'btn-danger' : 'btn-success'"
                    th:text="${plan.active} ? 'Retire Plan' : 'Put Back on Sale'">
                Confirm
            </button>
        </div>
    </form>
</div>

<!-- Empty fragment returned when modal closes after successful save -->
<div class="modal-content" th:fragment="modalClosed"></div>

</body>
</html>
